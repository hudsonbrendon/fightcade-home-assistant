[project]
name = "fightcade-home-assistant"
version = "0.2.1"
description = "Home Assistant custom integration for Fightcade"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF", "PL", "PT"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --cov=custom_components.fightcade --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/fightcade"]

[tool.mypy]
python_version = "3.13"
strict = true
